name: Http4k Backend Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-master:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.check.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - name: Check whether the merged PR already passed this suite
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const shouldRun = require('./.github/scripts/ci-should-run.cjs');
            return await shouldRun({ github, context, core, workflowId: 'http4k-backend-test.yml' });

  test:
    needs: check-master
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && needs.check-master.outputs.run-tests != 'false') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.state == 'open' && !github.event.pull_request.draft)
      )
    runs-on: ubuntu-latest

    env:
      DB_NAME: test-db
      DB_USER: test-user
      DB_PASSWORD: test-password

    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Run Database Migrations
      uses: docker://flyway/flyway:latest-alpine
      env:
        FLYWAY_URL: jdbc:postgresql://postgres:5432/${{ env.DB_NAME }}
        FLYWAY_USER: ${{ env.DB_USER }}
        FLYWAY_PASSWORD: ${{ env.DB_PASSWORD }}
        FLYWAY_LOCATIONS: filesystem:/github/workspace/conduit-backend/db-migration/main,filesystem:/github/workspace/conduit-backend/db-migration/test
        # Set container's JAVA_HOME to prevent GitHub Actions from passing its own Java path
        # This ensures the container uses its internal Java installation at /opt/java/openjdk
        JAVA_HOME: /opt/java/openjdk
      with:
        args: migrate

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Run Backend Tests
      working-directory: conduit-backend
      env:
        DB_URL: jdbc:postgresql://localhost:5432/${{ env.DB_NAME }}
        DB_USER: ${{ env.DB_USER }}
        DB_PASSWORD: ${{ env.DB_PASSWORD }}
      run: |
        ./gradlew check 

    - name: Upload build reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: backend-build-reports
        path: conduit-backend/build/reports/
