[versions]
kotlin = "2.4.20"
ksp = "2.3.12"
java = "25"
agp = "9.4.1" # ! if using Android plugin in IDEA, need to switch to a version that IDEA supports
android-compileSdk = "37"
android-targetSdk = "36" # setting targetSdk on per with compileSdk has great benefits, such as layout inspector
android-minSdk = "26"
compose = "1.12.1"
compose-material3 = "1.9.0"
compose-adaptive = "1.3.0"
coil = "3.6.3"
multiplatform-markdown-renderer = "0.45.0"

androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.1.1"
androidx-savedstate = "1.5.0"
robolectric = "4.17"

mvikotlin = "4.4.0"
koin = "4.2.2"
kstore = "1.1.0"
ktor = "3.6.0"
ktorfit-plugin = "2.7.5"
ktorfit-lib = "2.7.5"
ktorfit-converter = "2.7.5"
ktorfit-compilerPlugin = "2.3.5"

junit = "6.1.3"
http4k = "6.61.0.0"
exposed = "1.5.0"

[libraries]
# dev dep
# multiplatform
dev-serializationJson = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
dev-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.8.0"
dev-kotlinLogging = "io.github.oshai:kotlin-logging:8.0.4"
dev-coroutinesBom = "org.jetbrains.kotlinx:kotlinx-coroutines-bom:1.11.0"
dev-koinBom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }

# frontend
dev-frontend-mvikotlin = { module = "com.arkivanov.mvikotlin:mvikotlin", version.ref = "mvikotlin" }
dev-frontend-mvikotlinMain = { module = "com.arkivanov.mvikotlin:mvikotlin-main", version.ref = "mvikotlin" }
dev-frontend-mvikotlinCoroutines = { module = "com.arkivanov.mvikotlin:mvikotlin-extensions-coroutines", version.ref = "mvikotlin" }
dev-frontend-mvikotlinLogging = { module = "com.arkivanov.mvikotlin:mvikotlin-logging", version.ref = "mvikotlin" }
dev-frontend-kotlinWrapper = "org.jetbrains.kotlin-wrappers:kotlin-wrappers-bom:2026.9.3"

# Compose Multiplatform core dependencies (direct Maven coordinates, replacing deprecated accessors)
dev-frontend-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
dev-frontend-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
dev-frontend-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
dev-frontend-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
dev-frontend-compose-material3AdaptiveNavigationSuite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3" }
dev-frontend-compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
dev-frontend-compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
dev-frontend-compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
dev-frontend-compose-desktopCommon = { module = "org.jetbrains.compose.desktop:desktop", version.ref = "compose" }

dev-frontend-compose-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "compose-adaptive" }
dev-frontend-compose-adaptiveLayout = { module = "org.jetbrains.compose.material3.adaptive:adaptive-layout", version.ref = "compose-adaptive" }
dev-frontend-compose-adaptiveNavigation = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation", version.ref = "compose-adaptive" }
dev-frontend-compose-materialIconsCore = "org.jetbrains.compose.material:material-icons-core:1.7.3" # required since compose 1.8.0
dev-frontend-coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
dev-frontend-coil-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
dev-frontend-coil-cacheControl = { module = "io.coil-kt.coil3:coil-network-cache-control", version.ref = "coil" }
dev-frontend-coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
dev-frontend-markdownRenderer = { module = "com.mikepenz:multiplatform-markdown-renderer", version.ref = "multiplatform-markdown-renderer" }
dev-frontend-markdownRenderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "multiplatform-markdown-renderer" }
dev-frontend-markdownRenderer-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "multiplatform-markdown-renderer" }
dev-frontend-markdownRenderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "multiplatform-markdown-renderer" }

dev-frontend-slf4jAndroid = "uk.uuid.slf4j:slf4j-android:2.0.20-0" # can't make kotlin-logging's android native log works for debug level, slf4j-android still works the best

dev-frontend-ktorBom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
dev-frontend-ktorfitLibLight = { module = "de.jensklingenberg.ktorfit:ktorfit-lib-light", version.ref = "ktorfit-lib" }
dev-frontend-ktorfitConverter = { module = "de.jensklingenberg.ktorfit:ktorfit-converters-response", version.ref = "ktorfit-converter" }
dev-frontend-kstore = { module = "io.github.xxfast:kstore", version.ref = "kstore" }
dev-frontend-kstore-file = { module = "io.github.xxfast:kstore-file", version.ref = "kstore" }
dev-frontend-kstore-storage = { module = "io.github.xxfast:kstore-storage", version.ref = "kstore" }
dev-frontend-kotlinxBrowser = "org.jetbrains.kotlinx:kotlinx-browser:0.5.0" # see https://kotlinlang.org/docs/wasm-js-interop.html#web-related-browser-apis

# android
dev-frontend-androidx-coreKtx = "androidx.core:core-ktx:1.19.1"
dev-frontend-androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
dev-frontend-androidx-lifecycleKtx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-activityCompose = "androidx.activity:activity-compose:1.13.0"

# Lifecycle, ViewModel, SavedState & Navigation 3 (KMP native)
dev-frontend-androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-lifecycle-viewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-lifecycle-viewmodelSavedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-lifecycle-viewmodelNavigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
dev-frontend-androidx-lifecycle-runtimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
dev-frontend-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
dev-frontend-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
dev-frontend-androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "androidx-savedstate" }
dev-frontend-androidx-savedstateCompose = { module = "androidx.savedstate:savedstate-compose", version.ref = "androidx-savedstate" }

# backend
dev-backend-http4kBom = { module = "org.http4k:http4k-bom", version.ref = "http4k" }
dev-backend-exposedBom = { module = "org.jetbrains.exposed:exposed-bom", version.ref = "exposed" }
dev-backend-junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
dev-backend-mockk = "io.mockk:mockk:1.14.11"
dev-frontend-test-robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
dev-backend-hoplite-yaml = "com.sksamuel.hoplite:hoplite-yaml:2.9.0"
dev-backend-postgresql = "org.postgresql:postgresql:42.7.13"
dev-backend-hikari = "com.zaxxer:HikariCP:7.1.0"
dev-backend-logback = "ch.qos.logback:logback-classic:1.6.5"
dev-backend-slf4j = "org.slf4j:slf4j-api:2.0.20"
dev-backend-jwt = "com.auth0:java-jwt:4.6.1"

# plugin dep
pluginDep-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
pluginDep-kotlinCompose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
pluginDep-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
pluginDep-compose = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
pluginDep-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
pluginDep-mokkery = "dev.mokkery:mokkery-gradle:3.5.1"
# Just a placeholder to let renovatebot detect and automatically update the compiler plugin version. The actual value is consumed by ktorfit { compilerPluginVersion.set(...) }.
pluginDep-ktorfitCompilerPlugin = { module = "de.jensklingenberg.ktorfit:compiler-plugin", version.ref = "ktorfit-compilerPlugin" }


# setting plugin dep
settingDep-develocity = "com.gradle.develocity:com.gradle.develocity.gradle.plugin:4.6.0"
settingDep-foojayResolver = "org.gradle.toolchains:foojay-resolver:1.0.0"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
ktorfit = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit-plugin" }
# a plugin used by gradle files for precompiled script plugin
buildConfig = { id = "com.github.gmazzo.buildconfig", version = "6.1.2" }
